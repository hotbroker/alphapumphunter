<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大哥的持仓监控仪表盘</title>
    <link rel="icon" type="image/png" href="static/logo.png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --sidebar-bg: #111827;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --active-bg: #334155;
            --border-color: #334155;
            --top10-color: #f59e0b;
            --top100-color: #10b981;
            --vol-color: #6366f1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        #sidebar {
            width: 280px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: all 0.3s;
        }

        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-header img {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            object-fit: cover;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        .sidebar-header h1 {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--accent-color);
            letter-spacing: -0.025em;
        }

        .sidebar-search {
            padding: 0 16px 16px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .search-input {
            width: 100%;
            padding: 10px 14px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent-color);
        }

        .sidebar-sort {
            padding: 12px 16px;
            display: flex;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .sort-btn {
            flex: 1;
            padding: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .sort-btn.active {
            background: var(--active-bg);
            color: var(--accent-color);
            border-color: var(--accent-color);
        }

        #token-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .token-item {
            padding: 8px 12px;
            margin-bottom: 2px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .token-item:hover {
            background-color: var(--active-bg);
        }

        .token-item.active {
            background-color: var(--active-bg);
            border-left: 4px solid var(--accent-color);
        }

        /* Removed generic div column rule to fix stacking */

        .token-symbol {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .token-vol {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .token-item-left {
            display: flex;
            flex-direction: row; /* Ensure row alignment */
            align-items: center;
            gap: 12px;
            flex: 1;
            overflow: hidden;
        }

        .token-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .token-stats {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            text-align: right;
        }

        .percent-main {
            font-size: 0.85rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .percent-sub {
            font-size: 0.7rem;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .favorite-star {
            cursor: pointer;
            font-size: 1rem;
            color: #334155;
            transition: all 0.2s;
            line-height: 1;
            flex-shrink: 0;
        }

        .favorite-star.active {
            color: #f59e0b;
            text-shadow: 0 0 8px rgba(245, 158, 11, 0.4);
        }

        .favorite-star:hover {
            color: #94a3b8;
            transform: scale(1.2);
        }

        .notes-container {
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            margin-top: 24px;
        }

        .notes-textarea {
            width: 100%;
            height: 100px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            padding: 12px;
            font-size: 0.9rem;
            resize: none;
            outline: none;
            margin-top: 12px;
        }

        .notes-textarea:focus {
            border-color: var(--accent-color);
        }

        .save-notes-btn {
            margin-top: 12px;
            padding: 8px 16px;
            background: var(--accent-color);
            color: var(--bg-color);
            border: none;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .save-notes-btn:hover {
            background: var(--accent-hover);
        }

        /* Main Content */
        #main-content {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .token-info-header h2 {
            font-size: 2rem;
            font-weight: 800;
        }

        .controls {
            display: flex;
            gap: 12px;
            background: var(--card-bg);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .control-btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .control-btn.active {
            background: var(--bg-color);
            color: var(--text-primary);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .stat-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        .stat-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
        }

        /* Chart Area */
        .chart-container {
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            position: relative;
            flex: 1;
            min-height: 400px;
        }

        .info-panel {
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .info-title {
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--accent-color);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        /* Loading */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            font-size: 1.5rem;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <div id="loader">加载中...</div>

    <aside id="sidebar">
        <div class="sidebar-header">
            <img src="static/logo.png" alt="Logo">
            <h1>Alpha Pump Hunter</h1>
        </div>
        <div class="sidebar-search">
            <input type="text" id="search-input" class="search-input" placeholder="搜索币名..."
                oninput="handleSearch(this.value)">
        </div>
        <div class="sidebar-sort">
            <button id="sort-vol" class="sort-btn active" onclick="setSort('vol')">交易量</button>
            <button id="sort-percent" class="sort-btn" onclick="setSort('percent')">前100占比</button>
            <button id="filter-fav" class="sort-btn" onclick="toggleFavFilter()">收藏</button>
        </div>
        <div id="token-list">
            <!-- Tokens injected here -->
        </div>
    </aside>

    <main id="main-content">
        <div class="header-actions">
            <div class="token-info-header">
                <h2 id="current-token-name">请选择币种</h2>
                <p id="token-ca" style="color: var(--text-secondary); font-size: 0.8rem; margin-top: 4px;"></p>
            </div>
            <div class="controls">
                <button class="control-btn active" onclick="setMode('top100')">Top 100</button>
                <button class="control-btn" onclick="setMode('top10')">Top 10</button>
                <button class="control-btn" onclick="setMode('bnalpha')">BN Alpha</button>
                <button class="control-btn" onclick="setMode('cex')">CEX</button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">最新持仓比例</div>
                <div class="stat-value" id="stat-percent">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">交易所持仓 (CEX)</div>
                <div class="stat-value" id="stat-cex">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">今日变动 (Δ)</div>
                <div class="stat-value" id="stat-change">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">周变动 (7d Δ)</div>
                <div class="stat-value" id="stat-change-7d">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">24h 合约交易额</div>
                <div class="stat-value" id="stat-vol">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">当前合约持仓 (OI)</div>
                <div class="stat-value" id="stat-oi">--</div>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="mainChart"></canvas>
        </div>

        <div class="info-panel" id="index-info-panel">
            <div class="info-title">价格指数构成 (Index Constituents)</div>
            <div id="index-details">暂无数据</div>
        </div>

        <div class="notes-container">
            <div class="info-title">备注 (Notes)</div>
            <textarea id="token-notes" class="notes-textarea" placeholder="在此输入对该币种的备注..."></textarea>
            <button class="save-notes-btn" onclick="saveNotes()">保存备注</button>
        </div>
    </main>

    <script>
        let tokens = [];
        let currentSymbol = null;
        let currentMode = 'top100'; // 'top10', 'top100', 'bnalpha', 'cex'
        let sortMode = 'vol'; // 'vol' or 'percent'
        let searchQuery = '';
        let showFavoritesOnly = false;
        let userdata = JSON.parse(localStorage.getItem('alphapumphunter_userdata') || '{}');
        let chart = null;

        function saveLocalData() {
            localStorage.setItem('alphapumphunter_userdata', JSON.stringify(userdata));
        }

        async function fetchTokens() {
            try {
                const res = await fetch('api/tokens');
                tokens = await res.json();
                renderTokenList();
                if (tokens.length > 0 && !currentSymbol) {
                    selectToken(tokens[0].symbol);
                }
                document.getElementById('loader').style.display = 'none';
            } catch (err) {
                console.error("Fetch tokens failed", err);
            }
        }

        function renderTokenList() {
            const list = document.getElementById('token-list');

            // 过滤
            let filtered = tokens.filter(t => t.symbol.toLowerCase().includes(searchQuery.toLowerCase()));
            if (showFavoritesOnly) {
                filtered = filtered.filter(t => userdata[t.symbol]?.isFavorite);
            }

            // 排序
            if (sortMode === 'vol') {
                filtered.sort((a, b) => (b.vol_24h || 0) - (a.vol_24h || 0));
            } else {
                filtered.sort((a, b) => (b.top100_percent || 0) - (a.top100_percent || 0));
            }

            list.innerHTML = filtered.map(t => {
                const isFav = userdata[t.symbol]?.isFavorite || false;
                const top100Percent = (t.top100_percent * 100).toFixed(1);
                const top10Percent = (t.top10_percent * 100).toFixed(1);
                const color = t.top100_percent > 0.95 ? '#ef4444' : t.top100_percent > 0.5 ? '#10b981' : '#f59e0b';
                
                return `
                <div class="token-item ${t.symbol === currentSymbol ? 'active' : ''}" onclick="selectToken('${t.symbol}')">
                    <div class="token-item-left">
                        <span class="favorite-star ${isFav ? 'active' : ''}" onclick="toggleFavorite('${t.symbol}', event)">★</span>
                        <div class="token-info">
                            <span class="token-symbol">${t.symbol}</span>
                            <span class="token-vol">${formatVol(t.vol_24h || 0)}</span>
                        </div>
                    </div>
                    <div class="token-stats">
                        <span class="percent-main" style="color: ${color}">${top100Percent}%</span>
                        <span class="percent-sub">(${top10Percent}%)</span>
                    </div>
                </div>
            `;}).join('');
        }

        function toggleFavFilter() {
            showFavoritesOnly = !showFavoritesOnly;
            document.getElementById('filter-fav').classList.toggle('active', showFavoritesOnly);
            renderTokenList();
        }

        function toggleFavorite(symbol, event) {
            event.stopPropagation();
            if (!userdata[symbol]) userdata[symbol] = { isFavorite: false, notes: '' };
            userdata[symbol].isFavorite = !userdata[symbol].isFavorite;
            saveLocalData();
            renderTokenList();
        }

        function saveNotes() {
            if (!currentSymbol) return;
            const notes = document.getElementById('token-notes').value;
            if (!userdata[currentSymbol]) userdata[currentSymbol] = { isFavorite: false, notes: '' };
            userdata[currentSymbol].notes = notes;
            saveLocalData();
            alert("备注已保存到本地！");
        }

        function handleSearch(val) {
            searchQuery = val;
            renderTokenList();
        }

        function setSort(mode) {
            sortMode = mode;
            document.getElementById('sort-vol').classList.toggle('active', mode === 'vol');
            document.getElementById('sort-percent').classList.toggle('active', mode === 'percent');
            renderTokenList();
        }

        async function selectToken(symbol) {
            currentSymbol = symbol;
            const token = tokens.find(t => t.symbol === symbol);
            document.getElementById('current-token-name').innerText = symbol;
            document.getElementById('token-ca').innerText = `CA: ${token.ca} (${token.chain})`;
            document.getElementById('token-notes').value = userdata[symbol]?.notes || '';

            renderTokenList();
            await refreshChart();
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.control-btn').forEach(btn => {
                const btnText = btn.innerText.replace(/\s+/g, '').toLowerCase();
                const target = mode === 'bnalpha' ? 'bnalpha' : mode;
                btn.classList.toggle('active', btnText === target);
            });
            refreshChart();
        }

        async function refreshChart() {
            if (!currentSymbol) return;
            try {
                const [histRes, indexRes] = await Promise.all([
                    fetch(`api/history/${currentSymbol}?hours=168`),
                    fetch(`api/index_history/${currentSymbol}`)
                ]);

                const history = await histRes.json();
                const indexHistory = await indexRes.json();

                if (history.length === 0) {
                    if (chart) chart.destroy();
                    return;
                }

                const labels = history.map(h => new Date(h.timestamp * 1000).toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }));
                const percentKey = currentMode === 'cex' ? 'cex_percent' : currentMode + '_percent';
                const percentData = history.map(h => h[percentKey] * 100);
                const volData = history.map(h => h.vol_24h / 1000000);
                const oiData = history.map(h => h.oi_usd / 1000000);

                updateStats(history);
                renderChart(labels, percentData, volData, oiData);

                // Render Index History List
                const indexDetails = document.getElementById('index-details');
                if (indexHistory.length > 0) {
                    indexDetails.innerHTML = indexHistory.map(item => `
                        <div style="display: flex; justify-content: space-between; border-bottom: 1px solid var(--border-color); padding: 8px 0;">
                            <span style="color: var(--text-secondary); width: 140px;">${new Date(item.timestamp * 1000).toLocaleDateString('zh-CN')}</span>
                            <span style="flex: 1; text-align: left;">${item.price_index_info}</span>
                        </div>
                    `).join('');
                } else {
                    indexDetails.innerText = '暂无详细构成数据';
                }

            } catch (err) {
                console.error("Refresh chart failed", err);
            }
        }

        function updateStats(history) {
            const last = history[history.length - 1];
            const currentVal = (last[currentMode + '_percent'] || 0) * 100;

            // 1. 今日变动 (24h) - 取 24h 前或最早的一条
            const dayAgo = (last.timestamp || Date.now() / 1000) - 86400;
            let dayRecord = history.find(h => h.timestamp >= dayAgo);
            if (!dayRecord) dayRecord = history[0];
            const dayVal = (dayRecord[currentMode + '_percent'] || 0) * 100;
            const dayChange = currentVal - dayVal;

            // 2. 周变动 (7d) - 取 7d 前或最早的一条
            const weekAgo = (last.timestamp || Date.now() / 1000) - 604800;
            let weekRecord = history.find(h => h.timestamp >= weekAgo);
            if (!weekRecord) weekRecord = history[0];
            const weekVal = (weekRecord[currentMode + '_percent'] || 0) * 100;
            const weekChange = currentVal - weekVal;

            document.getElementById('stat-percent').innerText = currentVal.toFixed(2) + '%';

            // 更新 CEX 显示
            const lastCex = (last.cex_percent || 0) * 100;
            document.getElementById('stat-cex').innerText = lastCex.toFixed(2) + '%';

            // 更新今日变动显示
            const changeEl = document.getElementById('stat-change');
            changeEl.innerText = (dayChange >= 0 ? '+' : '') + dayChange.toFixed(4) + '%';
            changeEl.style.color = dayChange >= 0 ? '#10b981' : '#ef4444';

            // 更新周变动显示 (显示增值和原值)
            const change7dEl = document.getElementById('stat-change-7d');
            change7dEl.innerHTML = `
                <div style="color: ${weekChange >= 0 ? '#10b981' : '#ef4444'}">
                    ${(weekChange >= 0 ? '+' : '') + weekChange.toFixed(4)}%
                </div>
                <div style="font-size: 0.75rem; color: var(--text-secondary); font-weight: 400; margin-top: 4px;">
                    (${weekVal.toFixed(2)}%)
                </div>
            `;

            document.getElementById('stat-vol').innerText = formatVol(last.vol_24h || 0);
            document.getElementById('stat-oi').innerText = formatVol(last.oi_usd || 0);
        }

        function renderChart(labels, percentData, volData, oiData) {
            const ctx = document.getElementById('mainChart').getContext('2d');

            if (chart) chart.destroy();

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: currentMode === 'top10' ? '前10持仓比例 (%)' :
                                currentMode === 'bnalpha' ? 'Alpha 地址持仓 (%)' :
                                    currentMode === 'cex' ? '交易所持仓 (%)' : '前100持仓比例 (%)',
                            data: percentData,
                            borderColor: currentMode === 'top10' ? '#f59e0b' :
                                currentMode === 'bnalpha' ? '#38bdf8' :
                                    currentMode === 'cex' ? '#ec4899' : '#10b981',
                            borderWidth: 3,
                            pointRadius: 2,
                            tension: 0.4,
                            yAxisID: 'y'
                        },
                        {
                            label: '合约持仓 OI (M)',
                            data: oiData,
                            borderColor: '#38bdf8',
                            borderWidth: 2,
                            borderDash: [5, 5],
                            pointRadius: 0,
                            tension: 0.1,
                            yAxisID: 'y2'
                        },
                        {
                            label: '24h 合约交易额 (M)',
                            data: volData,
                            backgroundColor: 'rgba(99, 102, 241, 0.1)',
                            borderColor: '#6366f1',
                            borderWidth: 1,
                            fill: true,
                            yAxisID: 'y1',
                            type: 'bar'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    scales: {
                        x: {
                            grid: { display: false, drawBorder: false },
                            ticks: { color: '#94a3b8', font: { size: 10 } }
                        },
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            grid: { color: 'rgba(255,255,255,0.05)', drawBorder: false },
                            ticks: { color: '#f8fafc' },
                            title: { display: true, text: '持仓比例 %', color: '#f8fafc' }
                        },
                        y1: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            grid: { drawOnChartArea: false },
                            ticks: { color: '#6366f1' },
                            title: { display: true, text: '交易额 (M)', color: '#6366f1' }
                        },
                        y2: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            grid: { drawOnChartArea: false },
                            ticks: { color: '#38bdf8' },
                            title: { display: true, text: '持仓 OI (M)', color: '#38bdf8' }
                        }
                    },
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            labels: { color: '#f8fafc', boxWidth: 10 }
                        }
                    }
                }
            });
        }

        function formatVol(num) {
            if (num >= 1000000000) return (num / 1000000000).toFixed(2) + 'B';
            if (num >= 1000000) return (num / 1000000).toFixed(2) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(2) + 'K';
            return num.toFixed(0);
        }

        // Init
        fetchTokens();
        setInterval(fetchTokens, 60000); // 1 minute refresh
    </script>
</body>

</html>
